</style></head><body><div class="wrap"><header class="mast"><div class="brand">MIDNIGHT <strong>NEET TRACKER<span style="color:var(--purple)">.</span></strong></div><button class="iconbtn" aria-label="Settings" onclick="go('settings')">⚙</button></header><main id="app"></main><div class="foot">Private by design · Your data stays in this browser · NEET 2027</div></div><nav class="nav" aria-label="Main navigation" id="nav"></nav><input id="importFile" type="file" accept="application/json,.json" onchange="importBackup(event)"><script>
'use strict';
const SYLLABUS = {
            Physics: ["Units & Measurements", "Kinematics", "Laws of Motion", "Work, Energy & Power", "System of Particles", "Gravitation", "Properties of Matter", "Thermodynamics", "Kinetic Theory", "Oscillations & Waves", "Electrostatics", "Current Electricity", "Magnetism", "EM Induction & AC", "Optics", "Modern Physics", "Electronic Devices"],
            Chemistry: ["Basic Concepts", "Structure of Atom", "Classification of Elements", "Chemical Bonding", "States of Matter", "Thermodynamics", "Equilibrium", "Redox Reactions", "Hydrogen", "s-Block", "p-Block", "Organic Chemistry Basics", "Hydrocarbons", "Solid State", "Solutions", "Electrochemistry", "Chemical Kinetics", "Surface Chemistry", "Coordination Compounds", "Haloalkanes", "Alcohols & Phenols", "Biomolecules", "Polymers"],
            Botany: ["The Living World", "Biological Classification", "Plant Kingdom", "Morphology of Plants", "Anatomy of Plants", "Cell: Unit of Life", "Cell Cycle", "Transport in Plants", "Mineral Nutrition", "Photosynthesis", "Respiration", "Plant Growth", "Reproduction", "Genetics & Inheritance", "Molecular Basis", "Biotechnology", "Ecology"],
            Zoology: ["Animal Kingdom", "Structural Organization", "Biomolecules", "Digestion", "Breathing", "Body Fluids", "Excretion", "Locomotion", "Neural Control", "Chemical Coordination", "Human Reproduction", "Reproductive Health", "Evolution", "Human Health", "Microbes in Welfare"]
        };const KEY='neet_tracker_v1', SUBJECTS=Object.keys(SYLLABUS), STAGES=[1,3,7,15,30], REASONS=['Concept mistake','Formula mistake','Calculation','Silly mistake','Question misread','Guess'];
let state,view='home',selectedSubject='Physics',selectedKey='',period=7,calendarMonth=new Date().getMonth(),calendarYear=new Date().getFullYear(),selectedDay='',timerHandle=null;
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), n=x=>Math.max(0,Number(x)||0), clamp=(x,a,b)=>Math.min(b,Math.max(a,x)), pct=(a,b)=>b?Math.round(a/b*100):0, date=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'), plus=(d,days)=>{let z=new Date(d+'T12:00:00');z.setDate(z.getDate()+days);return date(z)},fmt=ms=>ms>=3600000?(ms/3600000).toFixed(1)+'h':Math.round(ms/60000)+'m',duration=ms=>{let s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}, key=(s,c)=>s+':'+c, keys=s=>SYLLABUS[s].map(c=>key(s,c)), logsFor=(d)=>state.logs.filter(x=>x.date===d), qsum=ls=>ls.reduce((a,l)=>a+n(l.total),0), msum=ls=>ls.reduce((a,l)=>a+n(l.duration),0), asum=ls=>ls.reduce((a,l)=>a+n(l.attempted??(n(l.cor)+n(l.wrong))),0), csum=ls=>ls.reduce((a,l)=>a+n(l.cor??l.correct),0), bar=(v,max,cls='')=>`<div class="bar"><div class="fill ${cls}" style="width:${clamp(pct(v,max),0,100)}%"></div></div>`;
function init(){try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}normalize();applySettings();render();restoreTimer();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}
function normalize(){state.chData=state.chData&&typeof state.chData==='object'&&!Array.isArray(state.chData)?state.chData:{};state.logs=Array.isArray(state.logs)?state.logs.filter(l=>l&&typeof l==='object'):[];state.mistakes=Array.isArray(state.mistakes)?state.mistakes:[];state.settings=Object.assign({hours:8,questions:100,chapters:2,revision:2,glow:true,animations:true},state.settings||{});state.lastBackup=state.lastBackup||null;state.activeTimer=state.activeTimer||null;if(state.activeTimer?.running&&!state.activeTimer.phase4Timer){state.activeTimer.elapsed=Math.max(0,Date.now()-n(state.activeTimer.startedAt));state.activeTimer.startedAt=Date.now();state.activeTimer.phase4Timer=true}SUBJECTS.forEach(s=>SYLLABUS[s].forEach(c=>{let k=key(s,c),d=state.chData[k]||{};state.chData[k]={...d,status:d.status||'Not Started',prog:clamp(n(d.prog),0,100),time:n(d.time),cor:n(d.cor),att:n(d.att),skipped:n(d.skipped),revCount:clamp(n(d.revCount),0,5),nextRev:d.nextRev||null,revAnchor:d.revAnchor||null,completedOn:d.completedOn||null}}));state.logs.forEach(l=>{l.duration=n(l.duration);l.cor=n(l.cor??l.correct);l.skipped=n(l.skipped);l.wrong=n(l.wrong??(n(l.total)-l.cor-l.skipped));l.attempted=n(l.attempted??(l.cor+l.wrong));l.total=n(l.total??(l.attempted+l.skipped))});save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Browser storage is full or disabled. Export a backup now.')}}
function applySettings(){document.body.classList.toggle('low-glow',!state.settings.glow);document.body.classList.toggle('no-motion',!state.settings.animations)}
function streaks(){let days=[...new Set(state.logs.filter(l=>l.duration>=1800000||n(l.total)>0||l.type==='Revision'||l.type==='Chapter').map(l=>l.date))].sort(),best=0,run=0;days.forEach((d,i)=>{run=i&&plus(days[i-1],1)===d?run+1:1;best=Math.max(best,run)});let cur=0,ds=date();if(!days.includes(ds))ds=plus(ds,-1);while(days.includes(ds)){cur++;ds=plus(ds,-1)}return{cur,best}}
function due(k){let d=state.chData[k];if(d.revCount>=5)return null;return d.nextRev||(d.revAnchor?plus(d.revAnchor,STAGES[d.revCount]):null)}
function dueKeys(){return Object.keys(state.chData).filter(k=>due(k)&&due(k)<=date()).sort((a,b)=>due(a).localeCompare(due(b)))}
function subjectStats(s){let ks=keys(s),ds=ks.map(k=>state.chData[k]),ls=state.logs.filter(l=>l.sub===s),attempts=ds.reduce((a,d)=>a+n(d.att),0),correct=ds.reduce((a,d)=>a+n(d.cor),0);return{progress:Math.round(ds.reduce((a,d)=>a+n(d.prog),0)/ds.length),questions:ls.length?qsum(ls):attempts,accuracy:pct(correct,attempts),study:msum(ls)||ds.reduce((a,d)=>a+n(d.time),0)}}
function xp(){let completed=Object.values(state.chData).filter(d=>d.status==='Completed').length,revision=state.logs.filter(l=>l.type==='Revision').length,minutes=Math.floor(msum(state.logs)/60000),q=qsum(state.logs),s=streaks().cur;return completed*150+minutes*2+q*2+revision*60+s*10}
function weak(){return Object.keys(state.chData).map(k=>{let d=state.chData[k],m=state.mistakes.filter(x=>x.key===k).length,acc=pct(d.cor,d.att),gap=due(k)&&due(k)<date()?Math.min(20,Math.floor((new Date(date())-new Date(due(k)))/86400000)+5):0,score=(100-d.prog)*.35+(d.att>=10?(100-acc)*.4:0)+Math.min(m*7,25)+gap;return{k,score,acc,m}}).filter(x=>{let d=state.chData[x.k];return d.prog>0||d.att>0||x.m>0}).sort((a,b)=>b.score-a.score).slice(0,5)}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}
function nav(){let tabs=[['home','⌂','Home'],['syllabus','▦','Syllabus'],['timer','◷','Timer'],['questions','✎','Questions'],['analytics','▥','Analytics']];$('nav').innerHTML=tabs.map(([id,icon,title])=>`<button class="${view===id||(view==='chapter'&&id==='syllabus')||(view==='mistakes'&&id==='questions')||(view==='calendar'&&id==='analytics')?'active':''}" onclick="go('${id}')" aria-label="${title}"><span>${icon}</span>${title}</button>`).join('')}
function render(){nav();let fn={home,syllabus,chapter,timer,questions,mistakes,analytics,calendar,achievements,settings};$('app').innerHTML=fn[view]();if(view==='timer')renderTimerDisplay();}
function heading(title,extra=''){return `<div class="section"><h2>${title}</h2>${extra}</div>`}
function target(label,value,max,unit,cls){return `<div class="listrow"><div class="row"><b>${label}</b><span class="small">${value} / ${max} ${unit}</span></div>${bar(value,max,cls)}<span class="small">${Math.max(0,max-value)} ${unit} remaining</span></div>`}
function home(){let today=date(),ls=logsFor(today),stud=msum(ls),q=qsum(ls),ch=ls.filter(l=>l.type==='Chapter').length,rev=ls.filter(l=>l.type==='Revision').length,avg=Math.round(Object.values(state.chData).reduce((a,d)=>a+d.prog,0)/Object.keys(state.chData).length),st=streaks(),du=dueKeys(),w=weak(),ex=xp();return `<div class="hero"><div class="eyebrow">Your preparation at a glance</div><h1>NEET 2027</h1><p>One day at a time. Make today count.</p><div class="row" style="margin-top:22px"><span class="tag">LEVEL ${Math.floor(ex/750)+1} · ${ex.toLocaleString()} XP</span><button class="link" onclick="go('achievements')">Achievements ↗</button></div></div>${heading('Today · '+new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'}))}<div class="grid"><div class="card stat"><span class="symbol">🔥</span><strong class="accent-orange">${st.cur} days</strong><span class="small">Current streak · best ${st.best}</span></div><div class="card stat"><span class="symbol">📈</span><strong>${avg}%</strong><span class="small">Overall progress</span></div><div class="card stat"><span class="symbol">⏱</span><strong>${fmt(stud)}</strong><span class="small">Today's study time</span></div><div class="card stat"><span class="symbol">✎</span><strong>${q}</strong><span class="small">Today's questions</span></div></div>${heading("Today's targets",`<button class="link" onclick="go('settings')">Edit goals ↗</button>`)}<div class="card">${target('⏱ Study',+(stud/3600000).toFixed(1),n(state.settings.hours),'hr')}${target('✎ Questions',q,n(state.settings.questions),'questions','green')}${target('▦ Chapters',ch,n(state.settings.chapters),'chapters')}${target('↻ Revision',rev,n(state.settings.revision),'revisions','orange')}</div><div class="widegrid"> <div>${heading(`Revision queue <span class="pill">${du.length} due</span>`)}<div class="card">${du.length?du.slice(0,4).map(k=>`<div class="listrow row"><div><b>${esc(k.split(':').slice(1).join(':'))}</b><div class="small">${esc(k.split(':')[0])} · Due ${esc(due(k))}</div></div><button class="btn mini secondary" onclick="openChapter(${JSON.stringify(k).replace(/"/g,'&quot;')})">Open</button></div>`).join(''):'<div class="empty">Nothing due. Complete a chapter to start a revision cycle.</div>'}</div></div><div>${heading('Needs attention')}<div class="card">${w.length?w.slice(0,4).map(x=>`<div class="listrow row"><div><b>${esc(x.k.split(':').slice(1).join(':'))}</b><div class="small">${esc(x.k.split(':')[0])} · ${Math.round(x.score)} attention score</div></div><span class="accent-red">⚠</span></div>`).join(''):'<div class="empty">No chapter data yet. Log progress to see focus areas.</div>'}</div></div></div>${heading('Recent activity')}<div class="card">${state.logs.length?state.logs.slice(-4).reverse().map(l=>`<div class="listrow"><b>${esc(l.ch||l.sub||l.type||'Session')}</b><div class="small">${esc(l.date)} · ${esc(l.type||'Study')} ${l.duration?'· '+fmt(l.duration):''} ${l.total?'· '+l.total+' questions':''}</div></div>`).join(''):'<div class="empty">Your next study session will appear here.</div>'}</div>`}
function syllabus(){let all=SUBJECTS.map(s=>{let t=subjectStats(s);return `<button class="card" style="text-align:left;width:100%" onclick="subject(${JSON.stringify(s)})"><div class="row"><b>${esc(s)}</b><span class="tag">${t.progress}%</span></div>${bar(t.progress,100)}<span class="small">${t.questions} questions · ${t.accuracy}% accuracy · ${fmt(t.study)}</span></button>`}).join('');return `<div class="eyebrow">The big picture</div><h1>Syllabus tracker</h1><p class="muted">Progress, practice and revision for every chapter.</p><div class="stack">${all}</div><div class="notice" style="margin-top:17px">The chapter list is carried over from your current tracker. Check it against your latest official NEET syllabus; this app does not update it online.</div>`}
function subject(s){selectedSubject=s;view='syllabus-detail';render();window.scrollTo(0,0)}
function syllabusDetail(){let s=selectedSubject,t=subjectStats(s);return `<button class="link back" onclick="go('syllabus')">← All subjects</button><div class="eyebrow">Syllabus</div><h1>${esc(s)}</h1><div class="card"><b>${t.progress}% complete</b>${bar(t.progress,100)}<span class="small">${t.questions} questions · ${t.accuracy}% accuracy · ${fmt(t.study)} study</span></div>${heading('Chapters')}<div class="stack">${SYLLABUS[s].map(c=>{let k=key(s,c),d=state.chData[k];return `<button class="card" style="width:100%;text-align:left" onclick="openChapter(${JSON.stringify(k).replace(/"/g,'&quot;')})"><div class="row"><b>${esc(c)}</b><span class="pill">${esc(d.status)}</span></div>${bar(d.prog,100)}<span class="small">${d.prog}% · ${d.att} attempted · ${pct(d.cor,d.att)}% accuracy · ${d.revCount} revisions</span></button>`}).join('')}</div>`}
function openChapter(k){if(!state.chData[k])return;selectedKey=k;go('chapter')}
function chapter(){let k=selectedKey,d=state.chData[k],name=k.slice(k.indexOf(':')+1),when=due(k),stage=d.revCount;return `<button class="link back" onclick="subject(${JSON.stringify(k.split(':')[0])})">← ${esc(k.split(':')[0])}</button><div class="eyebrow">Chapter intelligence</div><h1>${esc(name)}</h1><div class="grid"><div class="card stat"><span class="small">Progress</span><strong>${d.prog}%</strong></div><div class="card stat"><span class="small">Study time</span><strong>${fmt(d.time)}</strong></div><div class="card stat"><span class="small">Questions attempted</span><strong>${d.att}</strong></div><div class="card stat"><span class="small">Accuracy</span><strong>${pct(d.cor,d.att)}%</strong></div></div>${heading('Chapter status')}<div class="card"><label for="chapterStatus">Status</label><select id="chapterStatus" onchange="chapterStatus(this.value)">${['Not Started','Studying','Completed','Revision Due'].map(x=>`<option ${x===d.status?'selected':''}>${x}</option>`).join('')}</select><div class="row"><label for="chapterProgress">Completion</label><b id="progressLabel">${d.prog}%</b></div><input id="chapterProgress" aria-label="Chapter completion" type="range" min="0" max="100" value="${d.prog}" oninput="$('progressLabel').textContent=this.value+'%'" onchange="setProgress(this.value)"><div class="small">Completion and status can be set independently. Mark Completed to start the 1/3/7/15/30-day revision plan.</div></div>${heading('Revision cycle')}<div class="card"><div class="row"><b>${d.revCount}/5 completed</b><span class="tag">${when?'Next '+when:'No revision scheduled'}</span></div><div class="tabs" style="margin:15px 0">${STAGES.map((x,i)=>`<span class="tag" style="${i<stage?'color:var(--green);border-color:var(--green)':i===stage?'color:var(--orange)':''}">${i<stage?'✓':i===stage&&when&&when<=date()?'🔔':'○'} Day ${x}</span>`).join('')}</div><button class="btn full" onclick="completeRevision()" ${!when||when>date()?'disabled':''}>${when&&when<=date()?'Mark revision done':'Revision not due yet'}</button><div class="small" style="margin-top:10px">${when&&when<date()?'Overdue since '+when:when?'Due '+when:'Complete the chapter to begin.'}</div>${when?`<button class="link" onclick="setCustomRevision()">Set a different next date</button>`:''}</div>`}
function setProgress(v){state.chData[selectedKey].prog=clamp(n(v),0,100);save();render()}
function chapterStatus(v){let d=state.chData[selectedKey],was=d.status;d.status=v;if(v==='Completed'){d.prog=100;if(!d.revAnchor&&!d.nextRev&&d.revCount<5){d.revAnchor=date();d.completedOn=date();d.nextRev=plus(date(),1)}if(was!=='Completed'){state.logs.push({date:date(),sub:selectedKey.split(':')[0],ch:selectedKey.slice(selectedKey.indexOf(':')+1),duration:0,total:0,cor:0,wrong:0,skipped:0,attempted:0,type:'Chapter'})}}save();render()}
function completeRevision(){let d=state.chData[selectedKey],when=due(selectedKey);if(!when||when>date())return;d.revAnchor=d.revAnchor||plus(when,-STAGES[d.revCount]);d.revCount=Math.min(5,d.revCount+1);d.nextRev=d.revCount>=5?null:plus(d.revAnchor,STAGES[d.revCount]);state.logs.push({date:date(),sub:selectedKey.split(':')[0],ch:selectedKey.slice(selectedKey.indexOf(':')+1),duration:0,total:0,cor:0,wrong:0,skipped:0,attempted:0,type:'Revision'});save();render()}
function setCustomRevision(){let old=due(selectedKey),v=prompt('Next revision date (YYYY-MM-DD)',old);if(v===null)return;if(!/^\d{4}-\d\d-\d\d$/.test(v)||isNaN(new Date(v+'T12:00:00').getTime()))return alert('Enter a valid date as YYYY-MM-DD.');state.chData[selectedKey].nextRev=v;save();render()}
function selectFields(prefix){return `<div class="formgrid"><div><label for="${prefix}Sub">Subject</label><select id="${prefix}Sub" onchange="populateCh('${prefix}')">${SUBJECTS.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div><label for="${prefix}Ch">Chapter</label><select id="${prefix}Ch">${SYLLABUS.Physics.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div>`}
function populateCh(prefix){let s=$(prefix+'Sub').value;$(prefix+'Ch').innerHTML=SYLLABUS[s].map(c=>`<option>${esc(c)}</option>`).join('')}
function timer(){let a=state.activeTimer||{},today=logsFor(date()),t=msum(today);return `<div class="eyebrow">Focus station</div><h1>Study timer</h1><p class="muted">The timer keeps running if you close the page.</p><div class="card">${selectFields('timer')}<label for="sessionType">Session type</label><select id="sessionType">${['Study','Questions','Revision','Mock Test'].map(x=>`<option ${a.type===x?'selected':''}>${x}</option>`).join('')}</select><div class="timer" id="timerDisplay">00:00:00</div><div class="two-actions"><button class="btn" id="timerToggle" onclick="toggleTimer()">${a.running?'Pause':a.elapsed?'Resume':'Start'}</button><button class="btn secondary" onclick="stopTimer()">Save session</button></div><button class="link" onclick="resetTimer()">Discard timer</button></div>${heading(`Today · ${fmt(t)}`)}<div class="card">${SUBJECTS.map(s=>{let ms=msum(today.filter(l=>l.sub===s));return `<div class="listrow row"><span>${esc(s)}</span><b>${fmt(ms)}</b></div>`}).join('')}<div class="listrow row"><b>Total</b><b class="accent-green">${fmt(t)}</b></div></div>`}
function restoreTimer(){if(!state.activeTimer)return;let a=state.activeTimer;if(view==='timer'){if(SYLLABUS[a.sub]){$('timerSub').value=a.sub;populateCh('timer');$('timerCh').value=a.ch||SYLLABUS[a.sub][0]}}if(a.running&&!timerHandle)timerHandle=setInterval(renderTimerDisplay,1000)}
function timerElapsed(){let a=state.activeTimer;return a?n(a.elapsed)+(a.running?Math.max(0,Date.now()-n(a.startedAt)):0):0}
function renderTimerDisplay(){if($('timerDisplay')){$('timerDisplay').textContent=duration(timerElapsed());if($('timerToggle'))$('timerToggle').textContent=state.activeTimer?.running?'Pause':timerElapsed()?'Resume':'Start'}}
function toggleTimer(){let a=state.activeTimer;if(a?.running){a.elapsed=timerElapsed();a.running=false;a.startedAt=null;clearInterval(timerHandle);timerHandle=null}else{a={elapsed:n(a?.elapsed),running:true,startedAt:Date.now(),phase4Timer:true,sub:$('timerSub').value,ch:$('timerCh').value,type:$('sessionType').value};timerHandle=setInterval(renderTimerDisplay,1000)}state.activeTimer=a;save();renderTimerDisplay()}
function stopTimer(){let ms=timerElapsed();if(ms<60000)return alert('Study for at least one minute before saving.');let a=state.activeTimer;state.logs.push({date:date(),sub:a.sub,ch:a.ch,type:a.type||'Study',duration:ms,cor:0,wrong:0,skipped:0,attempted:0,total:0});if(state.chData[key(a.sub,a.ch)])state.chData[key(a.sub,a.ch)].time+=ms;clearInterval(timerHandle);timerHandle=null;state.activeTimer=null;save();render();alert('Session saved.')}
function resetTimer(){if(!state.activeTimer||confirm('Discard this unsaved session?')){clearInterval(timerHandle);timerHandle=null;state.activeTimer=null;save();render()}}
function questions(){let today=logsFor(date()),ql=state.logs.filter(l=>l.total>0),att=asum(ql),cor=csum(ql);return `<div class="eyebrow">Practice lab</div><h1>Question tracker</h1><p class="muted">Accuracy is correct ÷ attempted. Skipped questions are not attempted.</p><div class="grid"><div class="card stat"><span class="small">Attempted</span><strong>${att}</strong></div><div class="card stat"><span class="small">Accuracy</span><strong>${pct(cor,att)}%</strong></div></div>${heading('Log practice',`<button class="link" onclick="go('mistakes')">Mistake book ↗</button>`)}<form class="card" onsubmit="logQuestions(event)">${selectFields('qs')}<label for="qsType">Type</label><select id="qsType">${['Practice','PYQ','DPP','Mock Test'].map(x=>`<option>${x}</option>`).join('')}</select><div class="formgrid"><div><label for="correct">Correct</label><input id="correct" type="number" min="0" value="0" required oninput="questionPreview()"></div><div><label for="wrong">Wrong</label><input id="wrong" type="number" min="0" value="0" required oninput="questionPreview()"></div><div><label for="skipped">Skipped</label><input id="skipped" type="number" min="0" value="0" required oninput="questionPreview()"></div></div><p class="small" id="qsPreview">0 total · 0 attempted · 0% accuracy</p><button class="btn full" type="submit">Save questions</button></form>${heading('Practice types')}<div class="card">${['Practice','PYQ','DPP','Mock Test'].map(t=>`<div class="listrow row"><span>${t}</span><b>${qsum(ql.filter(l=>l.type===t))}</b></div>`).join('')}</div>${heading('Recent question sessions')}<div class="card">${ql.length?ql.slice(-6).reverse().map(l=>`<div class="listrow row"><div><b>${esc(l.ch)}</b><div class="small">${esc(l.date)} · ${esc(l.type||'Practice')}</div></div><span>${l.cor}/${l.attempted} · ${pct(l.cor,l.attempted)}%</span></div>`).join(''):'<div class="empty">No questions logged yet.</div>'}</div>`}
function questionPreview(){let c=n($('correct').value),w=n($('wrong').value),s=n($('skipped').value);$('qsPreview').textContent=`${c+w+s} total · ${c+w} attempted · ${pct(c,c+w)}% accuracy`}
function logQuestions(e){e.preventDefault();let cor=Math.floor(n($('correct').value)),wrong=Math.floor(n($('wrong').value)),skipped=Math.floor(n($('skipped').value));if(!cor&&!wrong&&!skipped)return alert('Add at least one question.');let sub=$('qsSub').value,ch=$('qsCh').value;state.logs.push({date:date(),sub,ch,type:$('qsType').value,duration:0,cor,wrong,skipped,attempted:cor+wrong,total:cor+wrong+skipped});let d=state.chData[key(sub,ch)];d.cor+=cor;d.att+=cor+wrong;d.skipped+=skipped;save();render()}
function mistakes(){let counts=Object.fromEntries(REASONS.map(r=>[r,state.mistakes.filter(m=>m.reason===r).length])),total=state.mistakes.length;return `<button class="link back" onclick="go('questions')">← Questions</button><div class="eyebrow">Learn from errors</div><h1>Mistake book</h1><p class="muted">Keep short notes so the same error doesn't return.</p><form class="card" onsubmit="addMistake(event)">${selectFields('mistake')}<label for="reason">Reason</label><select id="reason">${REASONS.map(x=>`<option>${x}</option>`).join('')}</select><label for="mistakeNote">What went wrong? (optional)</label><textarea id="mistakeNote" maxlength="500" placeholder="Formula, concept or question detail"></textarea><button class="btn full" type="submit">Save mistake</button></form>${heading(`Pattern analysis · ${total}`)}<div class="card">${total?REASONS.map(r=>`<div class="listrow"><div class="row"><span>${esc(r)}</span><b>${pct(counts[r],total)}% · ${counts[r]}</b></div>${bar(counts[r],total,'red')}</div>`).join(''):'<div class="empty">No mistakes logged yet.</div>'}</div>${heading('Entries')}<div class="card">${total?state.mistakes.slice().reverse().slice(0,30).map(m=>`<div class="listrow"><div class="row"><b>${esc(m.key||'Chapter')}</b><span class="pill">${esc(m.reason)}</span></div><div class="small">${esc(m.date)}${m.note?' · '+esc(m.note):''}</div><button class="link" onclick="removeMistake('${esc(m.id)}')">Remove</button></div>`).join(''):'<div class="empty">Add a mistake to spot recurring patterns.</div>'}</div>`}
function addMistake(e){e.preventDefault();state.mistakes.push({id:String(Date.now())+Math.random().toString(36).slice(2),date:date(),key:key($('mistakeSub').value,$('mistakeCh').value),reason:$('reason').value,note:$('mistakeNote').value.trim().slice(0,500)});save();render()}
function removeMistake(id){if(confirm('Remove this mistake entry?')){state.mistakes=state.mistakes.filter(m=>m.id!==id);save();render()}}
function rangeLogs(){let start=period===0?'0000-01-01':plus(date(),1-period);return state.logs.filter(l=>l.date>=start&&l.date<=date())}
function chart(title,values,labels,color=''){let max=Math.max(1,...values);return `<div class="card"><h3>${title}</h3><div class="chart">${values.map((v,i)=>`<div class="chartcol"><div class="pillar" style="height:${Math.max(3,Math.round(v/max*111))}px;${color?'background:var(--'+color+')':''}" title="${esc(labels[i])}: ${v}"></div><small>${esc(labels[i])}</small></div>`).join('')}</div></div>`}
function analytics(){let ls=rangeLogs(),dur=msum(ls),att=asum(ls),cor=csum(ls),days=period===0?30:Math.min(period,30),dates=Array.from({length:days},(_,i)=>plus(date(),i-days+1)),dayLabels=dates.map(d=>d.slice(5)),study=dates.map(d=>+(msum(ls.filter(l=>l.date===d))/3600000).toFixed(1)),qs=dates.map(d=>qsum(ls.filter(l=>l.date===d))),acc=dates.map(d=>pct(csum(ls.filter(l=>l.date===d)),asum(ls.filter(l=>l.date===d)))),st=streaks();return `<div class="eyebrow">Signals & momentum</div><h1>Analytics center</h1><div class="tabs">${[[1,'Today'],[7,'7 days'],[30,'30 days'],[0,'All time']].map(([p,t])=>`<button class="${period===p?'sel':''}" onclick="period=${p};render()">${t}</button>`).join('')}</div><div class="grid" style="margin-top:14px"><div class="card stat"><span class="small">Study time</span><strong>${fmt(dur)}</strong></div><div class="card stat"><span class="small">Questions</span><strong>${qsum(ls)}</strong></div><div class="card stat"><span class="small">Accuracy</span><strong>${pct(cor,att)}%</strong></div><div class="card stat"><span class="small">Current streak</span><strong>${st.cur}d</strong></div></div>${heading('Study trends')}<div class="stack">${chart('Study hours',study,dayLabels)}${chart('Questions',qs,dayLabels,'green')}${chart('Daily accuracy %',acc,dayLabels,'orange')}</div>${heading('Subject performance')}<div class="stack">${SUBJECTS.map(s=>{let t=subjectStats(s),sl=ls.filter(l=>l.sub===s);return `<div class="card"><div class="row"><b>${esc(s)}</b><span class="tag">${t.progress}% syllabus</span></div>${bar(t.progress,100)}<div class="small">${qsum(sl)} questions · ${pct(csum(sl),asum(sl))}% accuracy · ${fmt(msum(sl))} study in selected range</div><div class="small">All time: ${t.questions} questions · ${t.accuracy}% accuracy · ${fmt(t.study)} study</div></div>`}).join('')}</div>${heading('Study distribution')}<div class="card">${SUBJECTS.map(s=>{let v=msum(ls.filter(l=>l.sub===s));return `<div class="listrow"><div class="row"><b>${esc(s)}</b><span class="small">${fmt(v)} · ${pct(v,dur)}%</span></div>${bar(v,dur)}</div>`}).join('')}</div>${heading('Streak history')}<div class="card"><div class="row"><b>Current ${st.cur} days</b><span class="tag">Best ${st.best} days</span></div><p class="small">A day counts when you save a 30-minute study session, questions, a chapter completion or a revision.</p></div><div class="two-actions" style="margin-top:15px"><button class="btn secondary" onclick="go('calendar')">Study calendar</button><button class="btn secondary" onclick="go('achievements')">Achievements</button></div>`}
function calendar(){let first=new Date(calendarYear,calendarMonth,1),count=new Date(calendarYear,calendarMonth+1,0).getDate(),offset=(first.getDay()+6)%7,cells=Array.from({length:offset},()=>'<div class="day blank"></div>');for(let i=1;i<=count;i++){let ds=date(new Date(calendarYear,calendarMonth,i)),ls=logsFor(ds);cells.push(`<button class="day ${ls.length?'active':''} ${ds===date()?'today':''}" onclick="selectedDay='${ds}';render()">${i}${ls.length?'<br>✦':''}</button>`)}let ds=selectedDay||date(),ls=logsFor(ds);return `<button class="link back" onclick="go('analytics')">← Analytics</button><div class="eyebrow">Your rhythm</div><h1>Study calendar</h1><div class="card"><div class="row"><button class="btn mini ghost" onclick="shiftMonth(-1)">←</button><b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="btn mini ghost" onclick="shiftMonth(1)">→</button></div><div class="calendar">${['M','T','W','T','F','S','S'].map(x=>`<div class="dayhead">${x}</div>`).join('')}${cells.join('')}</div></div>${heading(esc(ds))}<div class="card"><div class="grid"><div><span class="small">Study time</span><h3>${fmt(msum(ls))}</h3></div><div><span class="small">Questions</span><h3>${qsum(ls)}</h3></div><div><span class="small">Accuracy</span><h3>${pct(csum(ls),asum(ls))}%</h3></div><div><span class="small">Sessions</span><h3>${ls.length}</h3></div></div></div>`}
function shiftMonth(x){calendarMonth+=x;if(calendarMonth<0){calendarMonth=11;calendarYear--}if(calendarMonth>11){calendarMonth=0;calendarYear++}render()}
function achievements(){let completed=Object.values(state.chData).filter(d=>d.status==='Completed').length,study=msum(state.logs),questions=qsum(state.logs),acc=pct(csum(state.logs),asum(state.logs)),st=streaks(),ex=xp(),level=Math.floor(ex/750)+1,base=(level-1)*750;let badges=[['🏆 First chapter',completed>=1],['🔥 7-day streak',st.best>=7],['📚 10 chapters',completed>=10],['✎ 1,000 questions',questions>=1000],['🎯 90% accuracy (100+ attempts)',asum(state.logs)>=100&&acc>=90],['⏱ 100 study hours',study>=360000000]];return `<button class="link back" onclick="go('home')">← Home</button><div class="eyebrow">Your momentum</div><h1>Achievements</h1><div class="hero"><div class="eyebrow">Level ${level}</div><h1>${ex.toLocaleString()} XP</h1>${bar(ex-base,750)}<p>${750-(ex-base)} XP until level ${level+1}</p></div><div class="card" style="margin-top:15px"><p class="small">XP: 150 per completed chapter, 2 per study minute, 2 per question, 60 per revision, and 10 per current streak day. Your level is recalculated from saved activity.</p></div>${heading('Badges')}<div class="stack">${badges.map(([name,done])=>`<div class="card row"><b>${name}</b><span class="${done?'accent-green':'muted'}">${done?'Unlocked':'Locked'}</span></div>`).join('')}</div>`}
function settings(){let s=state.settings;return `<div class="eyebrow">Make it yours</div><h1>Settings</h1>${heading('Daily goals')}<form class="card" onsubmit="saveGoals(event)"><div class="formgrid">${[['hours','Study hours'],['questions','Questions'],['chapters','Chapters'],['revision','Revisions']].map(([id,label])=>`<div><label for="goal-${id}">${label}</label><input id="goal-${id}" type="number" min="1" max="10000" step="${id==='hours'?'0.5':'1'}" value="${n(s[id])}" required></div>`).join('')}</div><button class="btn full" type="submit">Save goals</button></form>${heading('Appearance')}<div class="card"><div class="listrow row"><b>Midnight purple glow</b><input type="checkbox" aria-label="Purple glow" ${s.glow?'checked':''} onchange="state.settings.glow=this.checked;save();applySettings()"></div><div class="listrow row"><b>Animations</b><input type="checkbox" aria-label="Animations" ${s.animations?'checked':''} onchange="state.settings.animations=this.checked;save();applySettings()"></div></div>${heading('Data & backup')}<div class="card"><p class="small">Last backup: ${state.lastBackup?esc(state.lastBackup):'None recorded on this device'}</p><div class="two-actions"><button class="btn secondary" onclick="exportBackup()">Export backup</button><button class="btn secondary" onclick="$('importFile').click()">Import backup</button></div><p class="small">Import replaces all current data. Export a backup first. Keep the file somewhere safe; browser storage can be cleared.</p><button class="btn danger full" onclick="resetAll()">Reset all data</button></div><div class="notice" style="margin-top:16px">This app stores data only in this browser. It does not sync between devices. The installed PWA needs the existing manifest, icons and service worker alongside this file.</div>`}
function saveGoals(e){e.preventDefault();for(let id of ['hours','questions','chapters','revision']){let v=n($('goal-'+id).value);if(!v)return alert('Each goal must be above zero.');state.settings[id]=v}save();render();alert('Goals saved.')}
function exportBackup(){state.lastBackup=date();save();let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='neet_tracker_backup_'+date()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);render()}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!obj||typeof obj!=='object'||Array.isArray(obj)||!obj.chData||!Array.isArray(obj.logs)||typeof obj.chData!=='object'||Array.isArray(obj.chData))throw Error();if(!confirm('Replace all current study data with this backup? Export your current data first if needed.'))return;state=obj;normalize();clearInterval(timerHandle);timerHandle=null;go('home');restoreTimer();alert('Backup imported.')}catch{alert('That file is not a valid NEET Tracker backup.')}finally{e.target.value=''}};r.readAsText(f)}
function resetAll(){if(!confirm('Erase ALL study data on this device? This cannot be undone without a backup.'))return;if(!confirm('Really erase everything?'))return;localStorage.removeItem(KEY);clearInterval(timerHandle);timerHandle=null;state={};normalize();go('home')}
const originalRender=render;render=function(){nav();let fn={home,syllabus,'syllabus-detail':syllabusDetail,chapter,timer,questions,mistakes,analytics,calendar,achievements,settings};$('app').innerHTML=fn[view]();if(view==='timer'){restoreTimer();renderTimerDisplay()}};
init();
</script></body></html>
